[project]
name = "pain-point-pipeline"
version = "0.1.0"
description = "Finds recurring pain points in AI/automation communities and surfaces them as Opportunity Briefs."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.100", "pydantic>=2", "praw>=7", "requests>=2.31", "PyGithub>=2"]

[project.scripts]
pain-point-pipeline = "pain_point_pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]
# Only needed on the render host (the social-draft workflow), when scene-image
# generation is on. Local runs and tests never import it — FalImageGenAdapter
# imports fal_client lazily. Installed alongside Node/FFmpeg in that workflow.
video = ["fal-client>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real external API; excluded from the default run",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true

# fal-client is the optional [video] extra, imported lazily in fal_image.py;
# type-check the same whether or not it's installed in the current env.
[[tool.mypy.overrides]]
module = ["fal_client"]
ignore_missing_imports = true
